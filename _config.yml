# Site settings
title: Mohit Jain
description: Notes on code, startups and what I'm learning.
lang: en-US
timezone: Asia/Kolkata
image: assets/img/ogp.png # This image used for Open Graph more info https://ogp.me/
repo:
twitter:
  username: jainmohit27
social:
  name: Mohit Jain
  links:
    - https://github.com/mohitjain
mode: dark # default theme "dark" | "light"

# Profile settings
author:
  name: Mohit Jain
  bio:
  username: jainmohit27
  email: jain.mohit27@gmail.com
  avatar: /assets/img/avatar.jpg

# Url settings
url: "https://mohitjain.github.io"
baseurl:
permalink: /:title/
fb_appid:

# Collection setting
collections:
  posts:
    output: true

# Pagination (jekyll-paginate-v2)
pagination:
  enabled: true
  per_page: 10
  permalink: /page:num/
  sort_field: date
  sort_reverse: true

# Markdown settings
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: post
      comments: false

# Build settings
sass:
  style: compressed

keep_files:
  - pagefind

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - CHANGELOG.md
  - README.md
  - node_modules
  - CODE_OF_CONDUCT.md
  - bin

# Plugins
plugins:
  - jekyll-paginate-v2
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sass-converter
  - jekyll-sitemap
  - jekyll-postfiles
