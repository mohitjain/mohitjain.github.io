# Site settings
title: The Craft of Engineering
tagline: Systems, Intelligence, Architecture & Ideas.
description: A personal knowledge journal about engineering, technology, and the ideas that shape how we think and build.
lang: en-US
timezone: Asia/Kolkata
image: assets/img/ogp.png # This image used for Open Graph more info https://ogp.me/
repo:
twitter:
  username: jainmohit27
social:
  name: Mohit Jain
  links:
    - https://github.com/mohitjain
mode: light # default theme: "light", "dark" or "auto" (follow the visitor's system)

# Profile settings
author:
  name: Mohit Jain
  bio:
  username: jainmohit27
  email: jain.mohit27@gmail.com
  avatar: /assets/img/avatar.jpg

# Url settings
url: "https://mohitjain.github.io"
baseurl:
permalink: /:title/
fb_appid:

# Comments (giscus, backed by GitHub Discussions). Needs the giscus app installed on the repo:
# https://github.com/apps/giscus - leave repo_id empty to turn comments off.
giscus:
  repo: mohitjain/mohitjain.github.io
  repo_id: MDEwOlJlcG9zaXRvcnkzNDM1OTQ4OQ==
  category: Announcements
  category_id: DIC_kwDOAgxIwc4DJ_6T

# Analytics (Google Analytics 4): put the measurement ID here, e.g. "G-XXXXXXXXXX".
# Leave empty to load nothing. Only loads in production builds.
google_analytics:

# Newsletter (Buttondown): put your Buttondown username here to show the subscribe form.
# Leave empty to point readers at RSS instead.
newsletter:
  buttondown:

# Collection setting
collections:
  posts:
    output: true
  topics:
    output: true
    permalink: /topics/:name/
  experiments:
    output: true
    permalink: /experiments/:name/

# Pagination (jekyll-paginate-v2)
pagination:
  enabled: true
  per_page: 10
  permalink: /page:num/
  sort_field: date
  sort_reverse: true

# Markdown settings
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: post
      comments: false
  - scope:
      type: posts
    values:
      comments: true
  - scope:
      type: topics
    values:
      layout: topic
  - scope:
      type: experiments
    values:
      layout: experiment

# Build settings
sass:
  style: compressed

keep_files:
  - pagefind

exclude:
  - Gemfile
  - Gemfile.lock
  - CHANGELOG.md
  - README.md
  - node_modules
  - CODE_OF_CONDUCT.md
  - bin
  - Makefile

# Plugins
plugins:
  - jekyll-paginate-v2
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sass-converter
  - jekyll-sitemap
  - jekyll-postfiles
