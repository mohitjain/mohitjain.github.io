# Site settings
title: Mohit Jain
description: >-
lang: en-US
timezone: Asia/Kolkata
image: assets/img/ogp.png # This image used for Open Graph more info https://ogp.me/
repo:
mode: dark # default theme "dark" | "light"

# Profile settings
author:
  name: Mohit Jain
  bio:
  username: jainmohit27
  email: jain.mohit27@gmail.com
  avatar: /assets/img/avatar.jpg

# Url settings
url: "https://codebeerstartups.com"
baseurl:
permalink: /:title/
fb_appid:

# Collection setting
collections:
  posts:
    output: true

# Markdown settings
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: post
      comments: false

# Build settings
sass:
  style: compressed

exclude:
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - CHANGELOG.md
  - README.md
  - node_modules
  - CODE_OF_CONDUCT.md

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sass-converter
  - jekyll-sitemap
  - jekyll-postfiles
