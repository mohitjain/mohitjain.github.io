<a class="skip-link" href="#main-content">Skip to content</a>
<header class="site-header">
  <a class="site-name" href="/">{{ site.title }}</a>
  <nav class="site-nav" aria-label="Main">
    {% for menu in site.data.menus %}
    <a href="{{ menu.url }}"{% if page.url == menu.url %} aria-current="page"{% endif %}{% if menu.external %} rel="noopener"{% endif %}>{{ menu.title }}</a>
    {% endfor %}
    <button id="mood" type="button" aria-label="Toggle dark mode" aria-pressed="false">
      <svg class="mood-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="mood-sunny" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </nav>
</header>
