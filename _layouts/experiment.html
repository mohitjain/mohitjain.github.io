---
layout: compress
---

<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

{% include header.html %}

<body>
  {% include navbar.html %}
  <main id="main-content" tabindex="-1" class="layout" aria-label="Content">
    <aside class="rail">
      <header class="page-header">
        <p class="label"><a href="/experiments/">Experiment</a></p>
        <h1 class="page-title">{{ page.title | escape }}</h1>
        <p class="label post-meta">
          Status: {{ page.status | default: "idea" }}<br>
          {% if page.started %}Started {{ page.started | date: "%b %Y" }}{% endif %}
        </p>
      </header>
    </aside>
    <div class="column page-body prose">
      {{ content }}
    </div>
  </main>
  {% include footer.html %}
</body>

</html>
